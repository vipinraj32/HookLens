# HookLens on Render, FREE plan layout.
#
# Render dashboard -> New -> Blueprint -> pick this repository (branch main).
# Free instances only: two web services and a Postgres database. No Celery, Redis or background
# workers. The API runs jobs (scans, reports, AI, Foundry simulations) in-process with the local
# job runner. Free instances sleep after ~15 minutes without traffic; a job running when an instance
# stops is marked failed on the next start. Free Postgres expires 30 days after creation.
# See docs/deployment.md#render. For the paid layout (private API + workers) use render.paid.yaml.

services:
  # ------------------------------------------------------------------ API (public, free)
  # The backend Dockerfile's last stage is `sim` (app + forge/anvil/cast), so simulations can run
  # in this same process.
  - type: web
    name: hooklens-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass # deploy only after the CI checks on the commit pass
    dockerContext: .
    dockerfilePath: ./docker/backend.Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    healthCheckPath: /v1/health
    buildFilter:
      paths:
        - backend/**
        - packages/hooklens/**
        - contracts/**
        - docker/backend.Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: FORWARDED_ALLOW_IPS
        value: "*" # Render's proxy sets X-Forwarded-For
      - key: HOOKLENS_ENVIRONMENT
        value: production
      - key: HOOKLENS_JOB_BACKEND
        value: local # in-process thread pool; no Redis/Celery on the free plan
      - key: HOOKLENS_LOCAL_JOB_WORKERS
        value: "1" # 512 MB instance: one job at a time
      - key: HOOKLENS_AUTO_MIGRATE
        value: "true" # no pre-deploy command on free; migrate on startup
      - key: HOOKLENS_ENABLE_LOCAL_CHAIN
        value: "false"
      - key: HOOKLENS_AI_MODEL
        value: claude-opus-5-5
      - key: HOOKLENS_LOG_LEVEL
        value: INFO
      - key: FOUNDRY_FFI
        value: "false"
      - key: HOOKLENS_WORKSPACE_SECRET
        generateValue: true
      - key: HOOKLENS_DATABASE_URL
        fromDatabase:
          name: hooklens-db
          property: connectionString
      - key: HOOKLENS_MAINNET_RPC_URL
        sync: false
      - key: HOOKLENS_SEPOLIA_RPC_URL
        sync: false
      - key: HOOKLENS_ETHERSCAN_API_KEY
        sync: false
      - key: HOOKLENS_ANTHROPIC_API_KEY
        sync: false

  # ------------------------------------------------------------------ web UI (public, free)
  - type: web
    name: hooklens-web
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass # deploy only after the CI checks on the commit pass
    dockerContext: ./frontend
    dockerfilePath: ./docker/frontend.Dockerfile
    healthCheckPath: /
    buildFilter:
      paths:
        - frontend/**
        - docker/frontend.Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      # The API's PUBLIC URL, e.g. https://hooklens-api.onrender.com (free services cannot receive
      # private-network traffic). Baked in at build time: after changing it, redeploy this service.
      - key: HOOKLENS_API_URL
        sync: false

databases:
  - name: hooklens-db
    databaseName: hooklens
    user: hooklens
    region: oregon
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only
