name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.9.0
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        # v4-core is needed so tests/test_permissions_bytecode.py checks the generated
        # permission constants against the vendored Hooks.sol instead of skipping.
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            packages/hooklens/pyproject.toml
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # Anvil/forge-marked tests skip here; they run in the integration job.
      - run: uv run pytest -q

  cli:
    name: HookLens CLI package (ruff, mypy, pytest, build, wheel smoke test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/hooklens } }
    steps:
      - uses: actions/checkout@v4
        # v4-core sources are used by the fixture hook tests.
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/hooklens/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Real repository scan (uniswapfoundation/v4-template)
        env: { HOOKLENS_TEST_NETWORK: "1" }
        run: uv run pytest -q -m network
      - run: uv build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/hooklens --help
          /tmp/wheel-venv/bin/hooklens version
          cd /tmp && /tmp/wheel-venv/bin/hooklens scan "$GITHUB_WORKSPACE/contracts" --local             --json /tmp/r.json --sarif /tmp/r.sarif --html /tmp/r.html --fail-on never
      - uses: actions/upload-artifact@v4
        with:
          name: hooklens-dist
          path: packages/hooklens/dist/
          retention-days: 7

  action:
    name: HookLens composite action (dogfood on contracts/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - id: hooklens
        uses: ./
        with:
          target: contracts
          fail-on: high
          html-out: hooklens-report.html
          json-out: hooklens-report.json
          sarif-out: hooklens.sarif
          artifact-name: hooklens-dogfood
      - run: test "${{ steps.hooklens.outputs.exit-code }}" = "0"

  contracts:
    name: Contracts (forge build/test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - run: forge build --sizes
      - run: forge test -vvv
        env: { FOUNDRY_PROFILE: ci }

  frontend:
    name: Frontend (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration + E2E (Anvil, backend, frontend)
    runs-on: ubuntu-latest
    needs: [backend, contracts, frontend]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Start Anvil
        run: |
          anvil --port 8545 --code-size-limit 50000 --silent > /tmp/anvil.log 2>&1 &
          echo "ANVIL_PID=$!" >> "$GITHUB_ENV"
      - name: Deploy fixture hooks (Anvil public dev key, chain 31337 only)
        run: bash scripts/dev-chain.sh --deploy-only

      - name: Backend integration tests (fail if Anvil/forge are unavailable)
        working-directory: backend
        env: { HL_TEST_ANVIL: "1" }
        run: |
          uv sync --frozen
          uv run pytest -q -m "anvil or forge"

      - name: Build frontend
        working-directory: frontend
        env: { HOOKLENS_API_URL: "http://127.0.0.1:8000" }
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/e2e-results
            frontend/playwright-report
            /tmp/anvil.log
          retention-days: 7

  docker:
    name: Docker (compose config + image builds)
    runs-on: ubuntu-latest
    needs: [backend, contracts, frontend]
    env:
      # Throwaway values so `compose config` can interpolate required variables. Not secrets.
      HOOKLENS_WORKSPACE_SECRET: ci-only-not-a-secret-0123456789abcdef0123456789
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config -q
      - run: docker compose --profile dev-chain config -q
      - name: Build images
        run: docker compose build api sim-worker frontend
