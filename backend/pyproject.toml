[project]
name = "hooklens-backend"
version = "0.1.0"
description = "HookLens: Uniswap v4 LP intelligence and hook security testing backend"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "pycryptodome>=3.20",
  "eth-abi>=5.1",
  "eth-utils>=4.1",
  "py-solc-x>=2.0",
  "reportlab>=4.2",
  "langgraph>=0.2",
  "anthropic>=2.6",
  "hooklens",
]

[tool.uv.sources]
# The analysis engine lives in packages/hooklens so the CLI, GitHub Action and API share it.
hooklens = { path = "../packages/hooklens", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pypdf>=6.21.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "anvil: requires a running local Anvil node with HookLens fixtures deployed (HL_TEST_ANVIL=1)",
  "forge: requires the forge binary",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "B008", "UP040", "E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "hooklens"]  # the local alembic/ migrations dir is not first-party code

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
